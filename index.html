<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #243047;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 40px 20px;
        }

        main {
            padding: 30px 20px;
        }

        .card {
            background: white;
            max-width: 600px;
            margin: 20px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000015;
        }

        a {
            color: #2563eb;
        }

        footer {
            padding: 20px;
            background: #e2e8f0;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Website!</h1>
        <p>My first website hosted with GitHub Pages</p>
    </header>

    <main>
        <section class="card">
            <h2>About Me</h2>
            <p>Hello! I am learning web development and GitHub Pages.</p>
        </section>

        <section class="card">
            <h2>My Skills</h2>
            <p>HTML | CSS | GitHub</p>
        </section>

        <section class="card">
            <h2>My Project</h2>
            <p>This is my first static website deployment project.</p>
        </section>
    </main>

    <footer>
        <p>Created by Me | 2026</p>
    </footer>
</body>
</html>
